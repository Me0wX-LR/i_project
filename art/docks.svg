<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="dawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f0e0c"/>
      <stop offset="0.38" stop-color="#3a342a"/>
      <stop offset="0.62" stop-color="#a89c86"/>
      <stop offset="0.8" stop-color="#d8ccb5"/>
      <stop offset="1" stop-color="#5a5042"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e8dfcd" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#d8382a" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#d8382a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2a25"/>
      <stop offset="1" stop-color="#0b0b0a"/>
    </linearGradient>
    <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="#0b0a09" opacity="0.5"/>
    </pattern>
    <pattern id="dotsLight" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="#e8dfcd" opacity="0.5"/>
    </pattern>
    <filter id="fog" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="12" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="alpha"><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feComposite operator="in" in="alpha" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#dawn)"/>
  <circle cx="1120" cy="520" r="260" fill="url(#sun)" opacity="0.75"/>
  <circle cx="1120" cy="520" r="96" fill="#e8dfcd" opacity="0.55"/>

  <!-- distant city -->
  <g fill="#1a1814" opacity="0.7">
    <rect x="0" y="430" width="1600" height="160"/>
    <path d="M0 480 L60 480 L60 420 L120 420 L120 470 L210 470 L210 400 L260 400 L260 460 L360 460 L360 430 L430 430 L430 470 L520 470 L520 410 L570 410 L570 462 L650 462 L650 440 L1600 440 L1600 560 L0 560 Z"/>
    <rect x="760" y="360" width="18" height="100"/>
    <rect x="900" y="380" width="14" height="80"/>
  </g>

  <!-- water -->
  <rect x="0" y="560" width="1600" height="200" fill="url(#water)"/>
  <g stroke="#e8dfcd" opacity="0.2">
    <path d="M0 600 L1600 600 M0 630 L1600 630 M0 665 L1600 665 M0 705 L1600 705" stroke-width="2"/>
  </g>
  <g fill="#d8382a" opacity="0.18">
    <path d="M1080 575 L1190 575 L1210 720 L1050 720 Z"/>
  </g>

  <!-- docks -->
  <path d="M0 760 L1600 760 L1600 900 L0 900 Z" fill="#15130f"/>
  <path d="M0 760 L1600 760 L1600 800 L0 780 Z" fill="#2c2820"/>
  <g stroke="#080706" stroke-width="4">
    <path d="M0 810 L1600 810 M0 850 L1600 850"/>
  </g>
  <g fill="#0b0a09">
    <rect x="40" y="690" width="90" height="70"/>
    <rect x="150" y="670" width="70" height="90"/>
    <rect x="1390" y="660" width="90" height="100"/>
    <rect x="1490" y="680" width="70" height="80"/>
  </g>
  <g fill="#d8382a" opacity="0.65">
    <rect x="55" y="720" width="60" height="12"/>
    <rect x="1410" y="690" width="52" height="10"/>
  </g>

  <!-- container stacks -->
  <g>
    <rect x="150" y="470" width="240" height="80" fill="#171511" stroke="#080706" stroke-width="4"/>
    <rect x="185" y="390" width="200" height="80" fill="#211d17" stroke="#080706" stroke-width="4"/>
    <rect x="210" y="310" width="160" height="80" fill="#14120f" stroke="#080706" stroke-width="4"/>
    <g stroke="#3c352a" stroke-width="2" opacity="0.7">
      <path d="M170 490 L370 490 M170 510 L370 510 M170 530 L370 530 M200 410 L370 410 M200 430 L370 430 M200 450 L370 450"/>
    </g>
    <rect x="1180" y="480" width="300" height="90" fill="#1a1712" stroke="#080706" stroke-width="4"/>
    <rect x="1240" y="390" width="220" height="90" fill="#100f0c" stroke="#080706" stroke-width="4"/>
    <g stroke="#3c352a" stroke-width="2" opacity="0.6">
      <path d="M1200 505 L1460 505 M1200 530 L1460 530 M1260 415 L1440 415 M1260 440 L1440 440"/>
    </g>
  </g>

  <!-- gantry cranes -->
  <g fill="none" stroke="#090807" stroke-width="13">
    <path d="M520 620 L560 180 L610 180 L650 620"/>
    <path d="M560 240 L960 240 L960 290"/>
    <path d="M560 180 L960 180 L960 240"/>
    <path d="M700 240 L700 420"/>
    <path d="M760 240 L760 390"/>
    <path d="M820 240 L820 360"/>
  </g>
  <g fill="#0a0908">
    <rect x="680" y="420" width="40" height="26"/>
    <rect x="742" y="390" width="36" height="22"/>
    <rect x="802" y="360" width="34" height="22"/>
  </g>
  <g stroke="#2f2a22" stroke-width="3" opacity="0.8">
    <path d="M545 300 L640 300 M535 420 L650 420 M530 540 L655 540"/>
  </g>

  <!-- warning lights -->
  <g>
    <circle cx="560" cy="180" r="8" fill="#e8b53a"/>
    <circle cx="660" cy="600" r="6" fill="#d8382a"/>
    <circle cx="960" cy="180" r="6" fill="#d8382a"/>
    <circle cx="1180" cy="480" r="6" fill="#d8382a"/>
    <circle cx="1195" cy="480" r="24" fill="#d8382a" opacity="0.2" filter="url(#fog)"/>
  </g>

  <!-- fog bands -->
  <g fill="#d8ccb5" opacity="0.24" filter="url(#fog)">
    <rect x="-100" y="330" width="1800" height="90"/>
    <rect x="-100" y="430" width="1800" height="60"/>
    <rect x="-100" y="550" width="1800" height="70"/>
  </g>
  <g fill="#d8ccb5" opacity="0.12" filter="url(#fog)">
    <ellipse cx="400" cy="620" rx="380" ry="50"/>
    <ellipse cx="1200" cy="640" rx="420" ry="45"/>
  </g>

  <!-- silhouette on the dock -->
  <g fill="#070606">
    <path d="M1030 760 L1030 655 Q1030 620 1060 605 Q1080 595 1082 570 Q1085 545 1108 545 Q1132 546 1132 572 Q1132 596 1152 606 Q1180 622 1180 660 L1180 760 Z"/>
    <path d="M1060 600 L1150 600 L1150 625 L1060 625 Z" fill="#0b0a09"/>
  </g>
  <path d="M1130 630 L1118 675 L1130 705 L1117 742" stroke="#d8382a" stroke-width="3" fill="none" opacity="0.8"/>

  <!-- rain -->
  <g stroke="#e8dfcd" stroke-width="1" opacity="0.18">
    <path d="M120 40 L80 170 M220 0 L180 130 M330 50 L290 180 M440 10 L400 140 M550 60 L510 190 M660 20 L620 150 M770 70 L730 200 M880 30 L840 160 M990 80 L950 210 M1100 40 L1060 170 M1210 90 L1170 220 M1320 50 L1280 180 M1430 100 L1390 230 M1540 60 L1500 190"/>
  </g>
  <rect width="1600" height="900" fill="url(#dots)" opacity="0.12"/>
  <rect width="1600" height="900" fill="#e8dfcd" filter="url(#grain)" opacity="0.3"/>
</svg>
